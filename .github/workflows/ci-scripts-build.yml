name: mple

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:

env:
  SETUP_PATH: .github/workflows:.ci
  APT: libreadline-dev libevent-dev libtirpc-dev libboost-program-options-dev libboost-serialization-dev libboost-filesystem-dev

jobs:
  build-base:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CMP: ${{ matrix.cmp }}
      BCFG: ${{ matrix.configuration }}
      BASE: ${{ matrix.base }}
      SET: ${{ matrix.set }}
      EXTRA: ${{ matrix.extra }}

    strategy:
      fail-fast: false
      matrix:
        # Job names also name artifacts, character limitations apply
        include:
          - os: ubuntu-24.04
            cmp: gcc
            configuration: default
            set: master
            base: "7.0"
            name: "Base 7.0, Ub-24.04"

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Prepare and compile EPICS dependencies
        run: python .ci/cue.py prepare

      - name: Build mple-support
        shell: bash
        env:
          EPICS_HOST_ARCH: linux-x86_64
        run: |
          git clone --depth 1 https://github.com/nmarks99/mple-support.git "$RUNNER_TEMP/mple-support"
          cd "$RUNNER_TEMP/mple-support"
          cmake --preset release
          cmake --build "build/$EPICS_HOST_ARCH" --parallel $(nproc)
          cmake --install "build/$EPICS_HOST_ARCH"
          MPLE_SUPPORT="$PWD"
          cd -
          echo "MPLE_SUPPORT=$MPLE_SUPPORT" >> "configure/CONFIG_SITE.local"

      - name: Build mple
        run: python .ci/cue.py build

      - name: Run mple tests
        run: python .ci/cue.py -T 20M test

      - name: Upload tapfiles Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tapfiles ${{ matrix.name }}
          path: "**/O.*/*.tap"
          if-no-files-found: ignore

      - name: Collect and show test results
        if: ${{ always() }}
        run: python .ci/cue.py -T 5M test-results
