[project]
name = "mple"
version = "0.1.0"
description = "Python libary for mple"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "p4p>=4.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mple"]

[tool.ty.rules]
all = "warn"

[tool.ty.environment]
python = "./.venv"
